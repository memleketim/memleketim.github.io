<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edirne'nin Kültürel ve Doğal Zenginlikleri</title>
    <style>
        body {
            margin: 0; padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            max-width: 1200px; width: 95%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 { text-align: center; color: white; margin-bottom: 20px; font-size: 2.2em; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); }

        .instructions {
            text-align: center; color: white; margin-bottom: 20px; font-size: 1em;
            background: rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .map-container {
            position: relative; border-radius: 15px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: white; padding: 15px;
            max-width: 600px; margin: 0 auto;
        }

        .map-image { width: 100%; height: auto; display: block; margin: 0 auto; border-radius: 10px; }

        .quiz-point {
            position: absolute; width: 75px; height: 75px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px); border: 2px solid white;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            z-index: 5;
        }

        .quiz-point:hover { transform: scale(1.2); z-index: 10; background: rgba(255, 255, 255, 0.5); }

        .quiz-point-icon {
            width: 90px; height: 90px; object-fit: contain;
            animation: bounce 1.2s infinite alternate;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }

        .tooltip {
            position: absolute; background: rgba(0, 0, 0, 0.85); color: white;
            padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold;
            top: -40px; left: 50%; transform: translateX(-50%);
            opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
        }
        .quiz-point:hover .tooltip { opacity: 1; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 30px; border-radius: 25px; text-align: center; max-width: 550px; width: 90%; box-shadow: 0 15px 50px rgba(0,0,0,0.5); }
        .modal-content h2 { color: #764ba2; margin-bottom: 15px; font-size: 1.8em; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        .modal-content p { color: #444; line-height: 1.7; text-align: justify; font-size: 1.1em; margin-bottom: 25px; }
        
        .btn { padding: 12px 30px; border-radius: 30px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; transition: 0.3s; }
        .btn-primary { background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; }
        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4); }
        .btn-secondary { background: #eee; color: #555; border: none; margin-left: 10px; }

        /* 🗺️ Koordinatlar - Turuncu Dikey Edirne İl Sınırları İçerisine Dağılım */
        #p1 { top: 35%; left: 65%; } /* Selimiye Camii (Merkez) */
        #p2 { top: 48%; left: 70%; } /* Edirne Lezzetleri (Merkez-Güney) */
        #p3 { top: 62%; left: 55%; } /* Meriç Nehri (Güneybatı) */
        #p4 { top: 22%; left: 72%; } /* Kırkpınar (Kuzeydoğu) */
        #p5 { top: 78%; left: 40%; } /* Edirnekâri Sanatı (En Güney) */
    </style>
</head>
<body>

<div class="container">
    <div style="width: 100%; position: relative;">
        <h1>Edirne'nin Kültürel ve Doğal Zenginlikleri</h1>
        <a href="https://memleketim.github.io" class="btn btn-primary" style="position: absolute; top: 0; right: 0;">Ana Sayfa</a>
    </div>

    <div class="instructions">Haritadaki ikonlara tıklayarak eski başkentimiz Edirne'nin eşsiz tarihini, lezzetlerini ve geleneklerini keşfedebilirsiniz. 🌻</div>

    <div class="map-container">
        <img src="map.png" alt="Edirne Haritası" class="map-image">

        <div class="quiz-point" id="p1" 
             data-title="🕌 Selimiye Camii" 
             data-description="Mimar Sinan’ın 80 yaşında yarattığı ve 'ustalık eserim' dediği bu muazzam şaheser, UNESCO Dünya Mirası Listesi'nde yer alarak tüm dünyanın hayranlığını kazanmıştır. Gökyüzüne uzanan dört zarif minaresi, devasa kubbesi ve eşsiz çini işlemeleriyle Osmanlı'ya başkentlik yapmış serhat kenti Edirne'nin silüetini belirleyen en görkemli semboldür. Bu mimari deha, tarihe meydan okuyan duruşuyla ziyaretçilerini derinden etkiler."
             data-link="1.html">
            <div class="tooltip">Selimiye Camii</div>
            <img src="1.png" class="quiz-point-icon">
        </div>

        <div class="quiz-point" id="p2" 
             data-title="🥘 Meşhur Edirne Lezzetleri" 
             data-description="Trakya'nın bereketli topraklarından süzülüp gelen Edirne mutfağı, damaklarda unutulmaz izler bırakan muhteşem bir zenginliğe sahiptir. Özenle incecik dilimlenip çıtır çıtır kızartılan meşhur tava ciğeri, yöresel baharatlarla yoğrulan Edirne köftesi ve Osmanlı saray mutfağından miras kalan enfes badem ezmesi, şehrin yüzyıllardır süregelen eşsiz lezzet kültürünün vazgeçilmez köşe taşlarıdır."
             data-link="2.html">
            <div class="tooltip">Edirne Lezzetleri</div>
            <img src="2.png" class="quiz-point-icon">
        </div>

        <div class="quiz-point" id="p3" 
             data-title="🌉 Meriç Nehri ve Köprüsü" 
             data-description="Balkanlar'ın kalbi Bulgaristan'dan doğarak sınırları aşıp ülkemize bereket taşıyan Meriç Nehri, Edirne'nin can damarıdır. Nehrin suları üzerinde bir gerdanlık gibi tüm zarafetiyle uzanan Mecidiye (Meriç) taş köprüsü, asırlık mimarisiyle tarihe tanıklık eder. Özellikle gün batımında kızıla boyanan suların ve kemerli köprünün oluşturduğu kartpostallık manzara, misafirlere eşsiz ve büyüleyici bir görsel şölen sunar."
             data-link="3.html">
            <div class="tooltip">Meriç Nehri</div>
            <img src="3.png" class="quiz-point-icon">
        </div>

        <div class="quiz-point" id="p4" 
             data-title="🤼 Kırkpınar Yağlı Güreşleri" 
             data-description="Şehrin köklü kültürünü ve Trakya insanının bitmek tükenmek bilmeyen coşkusunu yansıtan Kırkpınar, altı yüz yılı aşkın bir geçmişe sahiptir. Davul zurna sesleri eşliğinde, pehlivanların kispetlerini giyip zeytinyağıyla yağlanarak er meydanında kıyasıya mücadele ettiği bu efsanevi organizasyon, dünyanın en eski ve kesintisiz devam eden büyük spor şöleni olarak Türk'ün gücünü ve mertliğini tüm dünyaya haykırır."
             data-link="4.html">
            <div class="tooltip">Kırkpınar Güreşleri</div>
            <img src="4.png" class="quiz-point-icon">
        </div>

        <div class="quiz-point" id="p5" 
             data-title="🎨 Edirnekâri Sanatı" 
             data-description="Osmanlı İmparatorluğu'nun estetik anlayışını günümüze taşıyan Edirnekâri, sabır ve ince zevkin muhteşem bir yansımasıdır. Ahşap, deri ve mukavva üzerine kendine has kök boyalarla yapılan; gül, lale, sümbül gibi doğa motiflerinin muazzam bir zarafetle işlendiği bu köklü süsleme sanatı, şehrin sanatsal kimliğinin temelini oluşturur. Çeyiz sandıklarından tavan işlemelerine kadar her detayda bu ince ruhu hissedebilirsiniz."
             data-link="5.html">
            <div class="tooltip">Edirnekâri Sanatı</div>
            <img src="5.png" class="quiz-point-icon">
        </div>
    </div>
</div>

<div id="infoModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle"></h2>
        <p id="modalText"></p>
        <div class="modal-buttons">
            <a href="#" id="activityLinkBtn" class="btn btn-primary">Etkinliğe Git</a>
            <button class="btn btn-secondary" id="closeModalBtn">Kapat</button>
        </div>
    </div>
</div>

<script>
    const quizPoints = document.querySelectorAll('.quiz-point');
    const modal = document.getElementById('infoModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const activityLinkBtn = document.getElementById('activityLinkBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    quizPoints.forEach(point => {
        point.addEventListener('click', function() {
            modalTitle.textContent = this.getAttribute('data-title');
            modalText.textContent = this.getAttribute('data-description');
            activityLinkBtn.href = this.getAttribute('data-link');
            modal.style.display = 'flex';
        });
    });

    closeModalBtn.addEventListener('click', () => modal.style.display = 'none');
    window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
</script>

</body>
</html>
