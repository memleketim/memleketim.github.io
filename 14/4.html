<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5efe6">
  <meta name="description" content="Göynük ve Mudurnu'nun sakin şehir kültürünü keşfeden etkileşimli Türkçe eğitim oyunu.">
  <title>Zamanın İzinde | Göynük &amp; Mudurnu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lora:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --wood: #2c1a0e;
      --stone: #f5efe6;
      --paper: #fffaf2;
      --emerald: #1a3c34;
      --gold: #d4a574;
      --blue: #6b8f8a;
      --ink: #28271f;
      --muted: #716d61;
      --line: rgba(44, 26, 14, .14);
      --shadow: 0 22px 70px rgba(44, 26, 14, .13);
      --serif: "Playfair Display", "Lora", Georgia, serif;
      --sans: "Plus Jakarta Sans", "Montserrat", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; min-height: 100%; background: var(--stone); }
    body { margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--sans); background: radial-gradient(ellipse at 18% 8%, rgba(212,165,116,.2), transparent 34%), radial-gradient(ellipse at 88% 40%, rgba(107,143,138,.13), transparent 32%), repeating-linear-gradient(117deg, rgba(44,26,14,.018) 0 1px, transparent 1px 5px), var(--stone); overflow-x: hidden; }
    button, a { font: inherit; }
    button { color: inherit; }
    button:focus-visible, a:focus-visible, [tabindex="0"]:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .grain { position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: .12; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E"); }
    .dust { position: fixed; inset: 0; overflow: hidden; z-index: 1; pointer-events: none; }
    .dust i { position: absolute; bottom: -12px; left: var(--x); width: var(--size); height: var(--size); border-radius: 50%; background: rgba(212,165,116,.8); box-shadow: 0 0 12px rgba(212,165,116,.65); animation: drift var(--duration) linear infinite; animation-delay: var(--delay); }
    @keyframes drift { to { transform: translate3d(var(--shift), -110vh, 0); opacity: 0; } }
    .topbar { position: fixed; z-index: 35; inset: 0 0 auto; height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(16px, 5vw, 76px); background: rgba(245,239,230,.86); border-bottom: 1px solid var(--line); backdrop-filter: blur(16px); }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--wood); }
    .brand img { width: 44px; height: 44px; object-fit: contain; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--gold); border-radius: 50%; font-family: var(--serif); color: var(--emerald); font-size: 19px; }
    .brand-title { font-family: var(--serif); font-size: 14px; line-height: 1.15; letter-spacing: .04em; }
    .brand-title small { display: block; margin-top: 4px; color: var(--muted); font: 10px var(--sans); letter-spacing: .1em; text-transform: uppercase; }
    .top-controls { display: flex; align-items: center; gap: 8px; }
    .icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 44px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 99px; background: rgba(255,250,242,.8); cursor: pointer; transition: transform .2s ease, background .2s ease, border-color .2s ease; }
    .icon-btn:hover { transform: translateY(-2px); background: white; border-color: var(--gold); }
    .student-banner { position: fixed; z-index: 34; inset: 72px 0 auto; min-height: 50px; display: flex; justify-content: center; align-items: center; padding: 7px 16px; text-align: center; text-decoration: none; color: #3c2915; font-family: var(--serif); font-weight: 700; font-size: clamp(12px, 1.35vw, 15px); background: linear-gradient(110deg, #bf8a4f 0%, #f3d7a1 20%, #fff5da 36%, #d4a574 52%, #f6e3b9 68%, #bf8a4f 86%); background-size: 220% 100%; animation: shimmer 5s ease-in-out infinite; box-shadow: 0 5px 22px rgba(109,70,28,.17); }
    .student-banner::before { content: "✦"; margin-right: 10px; color: #805b2a; }
    @keyframes shimmer { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
    main { position: relative; z-index: 2; min-height: 100vh; padding: 150px clamp(16px, 6vw, 90px) 76px; }
    #app { max-width: 1180px; min-height: calc(100vh - 230px); margin: auto; animation: appear .65s cubic-bezier(.2,.75,.25,1) both; }
    @keyframes appear { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .eyebrow { color: var(--emerald); font-size: 11px; font-weight: 700; letter-spacing: .19em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 600; }
    h1 { max-width: 720px; margin-bottom: 18px; color: var(--wood); font-size: clamp(39px, 6vw, 74px); line-height: 1.02; }
    h2 { font-size: clamp(30px, 4vw, 48px); line-height: 1.1; color: var(--wood); }
    h3 { font-size: 23px; }
    p { color: var(--muted); line-height: 1.75; }
    .cover { display: grid; grid-template-columns: minmax(0, .88fr) minmax(340px, 1.12fr); align-items: center; gap: clamp(24px, 5vw, 74px); min-height: min(650px, calc(100vh - 238px)); }
    .cover-copy { padding: 16px 0; }
    .cover-copy .eyebrow { margin-bottom: 17px; }
    .cover-copy .intro { max-width: 540px; margin-bottom: 26px; }
    .read-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 13px 0 22px; }
    .listen { min-height: 44px; padding: 0 14px; border: 1px solid rgba(26,60,52,.23); border-radius: 99px; background: rgba(255,250,242,.78); color: var(--emerald); font-size: 12px; font-weight: 700; cursor: pointer; transition: background .2s, transform .2s; }
    .listen:hover { background: white; transform: translateY(-1px); }
    .primary, .secondary { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 21px; border-radius: 3px; text-decoration: none; font-weight: 700; cursor: pointer; transition: transform .2s, box-shadow .2s, background .2s; }
    .primary { border: 1px solid var(--emerald); background: var(--emerald); color: #fffaf2; box-shadow: 0 9px 22px rgba(26,60,52,.19); }
    .primary:hover { transform: translateY(-2px); box-shadow: 0 13px 27px rgba(26,60,52,.24); background: #245447; }
    .secondary { border: 1px solid var(--line); background: rgba(255,250,242,.75); color: var(--wood); }
    .secondary:hover { transform: translateY(-2px); border-color: var(--gold); }
    .hero-scene { position: relative; min-height: 460px; overflow: hidden; border-radius: 3px; isolation: isolate; background: linear-gradient(180deg, #a7c2b5 0%, #d5d6c4 42%, #9d9d79 43%, #526c59 100%); box-shadow: var(--shadow); }
    .hero-scene::before { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: linear-gradient(115deg, transparent 30%, rgba(255,245,216,.35) 48%, transparent 64%), linear-gradient(0deg, rgba(27,38,29,.18), transparent 48%); }
    .sun { position: absolute; top: 48px; right: 17%; width: 86px; height: 86px; border-radius: 50%; background: #f5dca8; box-shadow: 0 0 65px 20px rgba(245,220,168,.42); }
    .hill { position: absolute; bottom: 105px; left: -10%; width: 125%; height: 190px; border-radius: 50% 50% 0 0; background: #6b8062; transform: rotate(-5deg); }
    .hill.back { bottom: 138px; left: 32%; background: #89927a; transform: rotate(8deg); }
    .village { position: absolute; z-index: 2; bottom: 77px; left: 8%; right: 7%; height: 245px; display: flex; align-items: end; justify-content: space-around; }
    .house { position: relative; width: 23%; max-width: 136px; height: var(--height); background: repeating-linear-gradient(0deg, #835a3a 0 8px, #9b704a 8px 11px); border: 3px solid #e3c8a3; border-bottom: 0; box-shadow: 8px 11px 18px rgba(44,26,14,.25); }
    .house::before { content: ""; position: absolute; top: -37px; left: -9px; width: calc(100% + 18px); height: 45px; background: #533821; clip-path: polygon(50% 0,100% 85%,95% 100%,5% 100%,0 85%); }
    .house::after { content: ""; position: absolute; inset: 26px 10px auto; height: 44px; background: repeating-linear-gradient(90deg, transparent 0 18px, #3b2c20 18px 22px, transparent 22px 40px); }
    .house:nth-child(2n) { background: repeating-linear-gradient(0deg, #a17951 0 7px, #805a3d 7px 10px); }
    .house .door { position: absolute; bottom: 0; left: 40%; width: 25%; height: 48px; border-radius: 18px 18px 0 0; background: #3e291b; }
    .house .window { position: absolute; top: 91px; left: 14%; width: 22px; height: 28px; border: 4px solid #d8b991; background: #526963; }
    .house .window.two { left: auto; right: 14%; }
    .lane { position: absolute; z-index: 2; bottom: -20px; left: 29%; width: 42%; height: 164px; background: linear-gradient(100deg,#9f8d71,#c5b69a 45%,#9f8d71); clip-path: polygon(40% 0,60% 0,100% 100%,0 100%); opacity: .9; }
    .scene-caption { position: absolute; z-index: 4; bottom: 19px; left: 23px; color: white; font: 13px var(--serif); text-shadow: 0 2px 7px rgba(0,0,0,.65); }
    .scene-tag { position: absolute; z-index: 4; top: 18px; left: 18px; padding: 8px 12px; border: 1px solid rgba(255,255,255,.45); background: rgba(44,26,14,.25); color: white; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; backdrop-filter: blur(8px); }
    .video-strip { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 26px; }
    .video-btn { min-height: 44px; padding: 0 13px; border: 0; border-bottom: 1px solid var(--gold); background: transparent; color: var(--wood); cursor: pointer; font-size: 12px; }
    .video-btn:hover { color: var(--emerald); }
    .stage-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 23px; }
    .stage-head h2 { margin: 7px 0 0; }
    .hud { display: flex; gap: 8px; flex-wrap: wrap; justify-content: end; }
    .hud span { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); background: rgba(255,250,242,.75); color: var(--wood); font-size: 12px; font-weight: 700; }
    .stage-layout { display: grid; grid-template-columns: minmax(0,1fr) 285px; gap: 23px; align-items: stretch; }
    .game-panel { min-height: 440px; padding: clamp(18px,3vw,34px); background: rgba(255,250,242,.81); border: 1px solid var(--line); box-shadow: 0 12px 40px rgba(44,26,14,.07); }
    .side-panel { padding: 24px; border-left: 1px solid var(--line); }
    .side-panel h3 { margin-bottom: 12px; }
    .side-panel p { font-size: 13px; }
    .cultural-note { padding: 14px; margin-top: 22px; border-left: 3px solid var(--gold); background: rgba(212,165,116,.12); font-family: var(--serif); font-size: 14px; line-height: 1.6; color: var(--wood); }
    .route-slots, .tile-bank { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 11px; }
    .route-slots { margin: 24px 0 16px; }
    .slot { min-height: 94px; padding: 10px; border: 1px dashed rgba(26,60,52,.4); background: rgba(107,143,138,.08); text-align: center; }
    .slot small { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; }
    .slot button { width: 100%; min-height: 52px; margin-top: 4px; border: 0; background: transparent; font-family: var(--serif); font-size: 15px; cursor: pointer; }
    .tile-bank { margin: 16px 0 24px; }
    .move-tile { min-height: 70px; padding: 10px; border: 1px solid var(--line); background: white; color: var(--wood); cursor: grab; font-family: var(--serif); font-size: 15px; transition: transform .18s, border .18s, background .18s; touch-action: manipulation; }
    .move-tile:hover, .move-tile.selected { transform: translateY(-3px); border-color: var(--gold); background: #fff4dc; }
    .move-tile:disabled { opacity: .38; cursor: default; }
    .feedback { min-height: 26px; margin: 12px 0 0; color: var(--emerald); font-size: 13px; font-weight: 700; }
    .word-loom { display: grid; gap: 13px; margin: 25px 0 22px; }
    .loom-row { min-height: 75px; display: flex; align-items: center; gap: 9px; padding: 10px; border-bottom: 2px solid rgba(107,143,138,.5); background: rgba(107,143,138,.06); }
    .loom-row strong { width: 66px; flex: 0 0 66px; color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .loom-row button { min-height: 46px; padding: 0 11px; border: 1px solid var(--line); background: white; font-family: var(--serif); cursor: pointer; }
    .loom-row .word { border-color: var(--gold); background: #fff2d9; color: var(--wood); }
    .loom-bank { display: flex; flex-wrap: wrap; gap: 9px; margin: 18px 0; }
    .loom-bank button { min-height: 48px; padding: 0 13px; border: 1px solid rgba(26,60,52,.24); border-radius: 2px; background: white; color: var(--emerald); cursor: pointer; }
    .match-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; margin: 22px 0 18px; }
    .place-card { position: relative; min-height: 190px; display: flex; flex-direction: column; justify-content: end; overflow: hidden; padding: 14px; border: 1px solid var(--line); text-align: left; cursor: pointer; background: linear-gradient(180deg,#b9c8bc,#e6d7bc 52%,#738c78 53%,#314b40); transition: transform .2s, box-shadow .2s; }
    .place-card::before { content: ""; position: absolute; width: 78%; height: 67%; left: 11%; bottom: 28%; background: repeating-linear-gradient(0deg,#8a6342 0 8px,#a47d57 8px 11px); clip-path: polygon(50% 0,100% 32%,91% 32%,91% 100%,9% 100%,9% 32%,0 32%); box-shadow: 5px 5px 8px rgba(0,0,0,.2); }
    .place-card:nth-child(2)::before { width: 58%; left: 20%; height: 55%; background: #e8e0cf; clip-path: polygon(50% 0,97% 17%,100% 100%,0 100%,3% 17%); border-top: 13px solid #68452c; }
    .place-card:nth-child(3)::before { width: 64%; left: 18%; height: 71%; background: repeating-linear-gradient(0deg,#9e7350 0 7px,#6e4a30 7px 10px); clip-path: polygon(50% 0,100% 29%,91% 29%,91% 100%,9% 100%,9% 29%,0 29%); }
    .place-card span { position: relative; z-index: 1; font-family: var(--serif); font-size: 14px; font-weight: 700; color: white; text-shadow: 0 2px 5px #29241d; }
    .place-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(44,26,14,.18); }
    .place-card.selected { outline: 3px solid var(--gold); outline-offset: 2px; }
    .clue-labels { display: flex; flex-wrap: wrap; gap: 9px; }
    .clue-labels button { min-height: 46px; padding: 0 13px; border: 1px solid var(--line); background: white; color: var(--wood); cursor: pointer; }
    .clue-labels button.used { opacity: .4; }
    .maze { display: grid; grid-template-columns: repeat(5,minmax(42px,1fr)); gap: 7px; max-width: 480px; margin: 22px auto 14px; }
    .maze button { aspect-ratio: 1; border: 1px solid rgba(44,26,14,.15); background: #e9e0d2; cursor: pointer; font-size: 19px; transition: transform .15s, background .15s; }
    .maze button:hover { transform: scale(1.04); background: #f8edd9; }
    .maze button.current { background: var(--emerald); color: white; }
    .maze button.goal { background: #e8c894; }
    .maze button.blocked { background: #d7d1c4; color: #aaa395; cursor: not-allowed; }
    .direction { text-align: center; padding: 13px; background: rgba(107,143,138,.1); font-family: var(--serif); color: var(--emerald); }
    .map-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .map-grid { position: relative; display: grid; grid-template-columns: repeat(4,1fr); gap: 15px; }
    .map-node { position: relative; min-height: 205px; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; border: 1px solid var(--line); background: rgba(255,250,242,.74); }
    .map-node.active { border-color: var(--gold); box-shadow: 0 9px 25px rgba(44,26,14,.08); }
    .map-node.locked { opacity: .53; }
    .map-node .number { color: var(--gold); font: 24px var(--serif); }
    .map-node h3 { margin: 10px 0; font-size: 20px; }
    .map-node p { margin: 0; font-size: 12px; line-height: 1.5; }
    .map-node button { align-self: start; min-height: 44px; margin-top: 16px; padding: 0 13px; border: 1px solid var(--emerald); background: var(--emerald); color: white; cursor: pointer; }
    .map-node.locked button { border-color: var(--line); background: transparent; color: var(--muted); cursor: not-allowed; }
    .progress-line { height: 4px; margin: 24px 0; background: linear-gradient(90deg,var(--gold) var(--progress),rgba(44,26,14,.12) var(--progress)); }
    .result { max-width: 720px; margin: 4vh auto; padding: clamp(25px,5vw,60px); text-align: center; background: rgba(255,250,242,.85); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .result .seal { display: grid; place-items: center; width: 82px; height: 82px; margin: 0 auto 20px; border: 1px solid var(--gold); border-radius: 50%; color: var(--gold); font: 36px var(--serif); }
    .result h2 { margin-bottom: 14px; }
    .result .primary { margin-top: 12px; }
    .bottom-bar { display: none; }
    .modal { position: fixed; z-index: 70; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(25,25,19,.82); backdrop-filter: blur(7px); }
    .modal.open { display: flex; animation: appear .25s ease both; }
    .modal-card { position: relative; width: min(900px,100%); padding: 14px; background: var(--paper); box-shadow: 0 25px 90px rgba(0,0,0,.35); }
    .modal-close { position: absolute; z-index: 2; top: 22px; right: 22px; min-width: 44px; min-height: 44px; border: 0; border-radius: 50%; background: var(--paper); cursor: pointer; font-size: 22px; }
    .modal iframe, .modal img { display: block; width: 100%; aspect-ratio: 16/9; border: 0; object-fit: contain; background: #231e18; }
    .modal figcaption { padding: 10px 4px 0; color: var(--muted); font-size: 12px; }
    .toast { position: fixed; z-index: 60; right: 22px; bottom: 22px; max-width: min(380px,calc(100vw - 32px)); padding: 13px 17px; background: var(--emerald); color: white; box-shadow: var(--shadow); transform: translateY(18px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
    .toast.show { transform: translateY(0); opacity: 1; }
    body.dark { color-scheme: dark; --stone: #252923; --paper: #31352d; --ink: #f3ebdc; --wood: #ecd8bc; --muted: #c2b8a8; --line: rgba(244,232,212,.18); --emerald: #315a4e; background: radial-gradient(ellipse at 18% 8%,rgba(91,106,78,.25),transparent 34%), repeating-linear-gradient(117deg,rgba(255,255,255,.018) 0 1px,transparent 1px 5px),#252923; }
    body.dark .topbar { background: rgba(37,41,35,.9); }
    body.dark .student-banner { color: #3c2915; }
    body.dark .game-panel, body.dark .map-node, body.dark .result, body.dark .icon-btn, body.dark .listen, body.dark .secondary { background-color: #31352d; }
    body.dark .move-tile, body.dark .loom-row button, body.dark .loom-bank button, body.dark .clue-labels button { background: #3a3e35; color: var(--ink); }
    body.dark .maze button { background: #41453c; color: var(--ink); }
    body.dark .maze button.current { background: #477567; }
    body.dark .topbar .brand-mark { color: #c5d8c9; }
    @media (max-width: 820px) {
      main { padding: 142px 20px 82px; }
      #app { min-height: calc(100vh - 224px); }
      .cover { grid-template-columns: 1fr; gap: 18px; }
      .cover-copy { padding-top: 2px; }
      .hero-scene { min-height: 330px; }
      .stage-layout { grid-template-columns: 1fr; gap: 0; }
      .game-panel { min-height: 380px; }
      .side-panel { padding: 20px 2px 0; border-left: 0; }
      .map-grid { grid-template-columns: repeat(2,1fr); }
      .bottom-bar { position: fixed; z-index: 33; inset: auto 0 0; display: flex; align-items: center; justify-content: space-around; min-height: 62px; padding: 7px 12px calc(7px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: rgba(245,239,230,.93); backdrop-filter: blur(15px); }
      .bottom-bar button { min-height: 44px; min-width: 44px; border: 0; background: transparent; color: var(--wood); font-size: 12px; font-weight: 700; cursor: pointer; }
      body.dark .bottom-bar { background: rgba(37,41,35,.95); }
      .toast { bottom: 76px; }
    }
    @media (max-width: 560px) {
      .topbar { height: 64px; padding: 0 13px; }
      .brand img, .brand-mark { width: 36px; height: 36px; }
      .brand-title { font-size: 12px; }
      .brand-title small { font-size: 9px; }
      .top-controls { gap: 4px; }
      .top-controls .icon-btn { min-width: 44px; padding: 0 9px; font-size: 11px; }
      .student-banner { inset-block-start: 64px; min-height: 54px; padding-inline: 9px; font-size: 11px; }
      main { padding: 135px 15px 90px; }
      .cover { min-height: auto; }
      h1 { font-size: 42px; }
      .hero-scene { min-height: 278px; }
      .sun { width: 58px; height: 58px; top: 32px; }
      .village { height: 185px; bottom: 65px; }
      .house { border-width: 2px; }
      .house .window { top: 66px; width: 15px; height: 19px; border-width: 3px; }
      .house .door { height: 35px; }
      .house::after { top: 18px; height: 31px; }
      .house::before { top: -27px; height: 34px; }
      .lane { height: 125px; }
      .stage-head, .map-head { align-items: start; flex-direction: column; }
      .hud { justify-content: start; }
      .game-panel { padding: 16px; }

  const prompts = [

  const mazePath = [[0,4],[0,3],[1,3],[2,3],[2,2],[2,1],[3,1],[4,1],[4,0]];

  const mazeBlocked = new Set(['0,0','1,0','2,0','3,0','1,1','3,2','4,2','0,2','4,3','3,4','1,4']);

  function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
  function listenButton(text, key = 'culture') { return `<button class="listen" type="button" data-speak="${escapeHtml(text)}" data-audio="${key}">🔊 Dinle</button>`; }
  function playTone(kind = 'good') {
    if (state.muted) return;
    try {
      const context = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = 'sine'; oscillator.frequency.value = kind === 'good' ? 660 : 185;
      gain.gain.setValueAtTime(.0001, context.currentTime);
      gain.gain.exponentialRampToValueAtTime(.09, context.currentTime + .025);
      gain.gain.exponentialRampToValueAtTime(.0001, context.currentTime + .28);
      oscillator.connect(gain); gain.connect(context.destination); oscillator.start(); oscillator.stop(context.currentTime + .3);
      oscillator.onended = () => context.close();
    } catch (_) { /* Ses desteği yoksa görsel ve metinsel geri bildirim sürer. */ }
  }
  function showToast(message) {
    const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show');
    clearTimeout(state.toastTimer); state.toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }
  function speak(text, key = 'culture') {
    const entry = audioFiles[key];
    if (entry && entry.text === text) {
      audio.pause(); audio.src = entry.file;
      audio.onerror = () => speakWithSpeech(text);
      audio.onended = null;
      const attempt = audio.play();
      if (attempt && typeof attempt.catch === 'function') attempt.catch(() => speakWithSpeech(text));
      return;
    }
    speakWithSpeech(text);
  }
  function speakWithSpeech(text) {
    if (!('speechSynthesis' in window)) { showToast('Seslendirme bu tarayıcıda kullanılamıyor. Metinler oyunda görünmeye devam eder.'); return; }
    window.speechSynthesis.cancel();
    speechUtterance = new SpeechSynthesisUtterance(text);
    speechUtterance.lang = 'tr-TR'; speechUtterance.rate = .88; speechUtterance.pitch = 1;
    speechUtterance.onboundary = event => highlightSpeech(text, event.charIndex);
    speechUtterance.onend = () => clearSpeechHighlight();
    window.speechSynthesis.speak(speechUtterance);
  }
  function highlightSpeech(text, index) {
    const blocks = [...document.querySelectorAll('[data-transcript]')];
    const target = blocks.find(block => block.dataset.transcript === text);
    if (!target) return;
    const before = document.createTextNode(text.slice(0, index));
    const mark = document.createElement('mark'); mark.textContent = text.slice(index, Math.min(text.length, index + 8));
    const after = document.createTextNode(text.slice(Math.min(text.length, index + 8)));
    target.replaceChildren(before, mark, after);
  }
  function clearSpeechHighlight() {
    document.querySelectorAll('[data-transcript]').forEach(block => { block.textContent = block.dataset.transcript; });
  }
  function setupDust() {
    const container = document.getElementById('dust');
    for (let index = 0; index < 18; index++) {
      const mote = document.createElement('i');
      mote.style.cssText = `--x:${Math.random()*100}%;--size:${2+Math.random()*3}px;--duration:${12+Math.random()*18}s;--delay:${-Math.random()*25}s;--shift:${Math.random()*80-40}px`;
      container.appendChild(mote);
    }
  }
  function renderCover() {
    state.screen = 'cover'; clearTimer();
    app.innerHTML = `<section class="cover" aria-label="Oyuna giriş">
      <div class="cover-copy">
        <div class="eyebrow">Bolu · Cittaslow rotası</div>
        <h1>Zamanın<br>İzinde</h1>
        <p class="intro" data-transcript="Tarihi dokusunu ve geleneksel yaşam tarzını günümüze kadar koruyan Göynük ve Mudurnu, Cittaslow ağına üye sakin şehirlerimizdir. Ahşap konakları, dar sokakları ve telaşsız yaşam ritmiyle bu güzel ilçelerde zaman adeta yavaş akar.">Tarihi dokusunu ve geleneksel yaşam tarzını günümüze kadar koruyan Göynük ve Mudurnu, Cittaslow ağına üye sakin şehirlerimizdir. Ahşap konakları, dar sokakları ve telaşsız yaşam ritmiyle bu güzel ilçelerde zaman adeta yavaş akar.</p>
        <div class="read-row">${listenButton('Tarihi dokusunu ve geleneksel yaşam tarzını günümüze kadar koruyan Göynük ve Mudurnu, Cittaslow ağına üye sakin şehirlerimizdir. Ahşap konakları, dar sokakları ve telaşsız yaşam ritmiyle bu güzel ilçelerde zaman adeta yavaş akar.', 'intro')}<span class="eyebrow">Aylin Dinç’in çalışması</span></div>
        <button class="primary" type="button" id="startGame">Yolculuğa başla <span aria-hidden="true">→</span></button>

      </div>
      <button class="hero-scene" type="button" aria-label="Göynük ve Mudurnu konaklarını büyük görüntüle" data-photo="kapak.png" data-caption="Göynük ve Mudurnu’nun tarihî ahşap konakları">
        <span class="scene-tag">Sakinliğin izinde</span><span class="sun"></span><span class="hill back"></span><span class="hill"></span>
        <span class="village"><span class="house" style="--height:67%"><i class="window"></i><i class="window two"></i><i class="door"></i></span><span class="house" style="--height:90%"><i class="window"></i><i class="window two"></i><i class="door"></i></span><span class="house" style="--height:73%"><i class="window"></i><i class="window two"></i><i class="door"></i></span><span class="house" style="--height:62%"><i class="window"></i><i class="window two"></i><i class="door"></i></span></span><span class="lane"></span><span class="scene-caption">Göynük &amp; Mudurnu · Bolu</span>
      </button>

    bindCommon();
    document.getElementById('startGame').addEventListener('click', renderMap);
  }
  function renderMap() {
    clearTimer(); state.screen = 'map';
    const progress = state.unlocked === 4 ? 100 : state.unlocked * 25;
    app.innerHTML = `<section><div class="map-head"><div><div class="eyebrow">Keşif haritası · ${state.score} yıldız puanı</div><h2>Yolculuk haritası</h2><p data-transcript="Her durakta yeni bir beceri keşfet. Bir sonraki durak, önceki aşamayı tamamlayınca açılır.">Her durakta yeni bir beceri keşfet. Bir sonraki durak, önceki aşamayı tamamlayınca açılır.</p>${listenButton('Her durakta yeni bir beceri keşfet. Bir sonraki durak, önceki aşamayı tamamlayınca açılır.', 'intro')}</div><button class="secondary" type="button" id="backCover">← Kapak</button></div>
      <div class="progress-line" style="--progress:${progress}%"></div><div class="map-grid">${stageNames.map((name,index)=>`<article class="map-node ${index < state.unlocked ? 'active' : 'locked'}"><span class="number">0${index+1}</span><div><h3>${name}</h3><p>${stageDescriptions[index]}</p></div>${index < state.unlocked ? `<button type="button" data-stage="${index}">${index < state.stage ? 'Yeniden oyna' : 'Aşamaya git'} →</button>` : '<button type="button" disabled>Önceki aşamayı tamamla</button>'}</article>`).join('')}</div></section>`;

  function startStage(index) {

    state.screen = 'stage';

  }
  function hudMarkup() { return `<div class="hud"><span>♡ ${state.lives} can</span><span>◷ <b id="seconds">${state.seconds}</b> sn</span><span>✦ ${state.score}</span></div>`; }

  function renderRoute() {
    return `<div class="eyebrow">İpuçlarını sıraya dönüştür</div><h3>Eski sokakların rotası</h3><p data-transcript="Önce ahşap konakların bulunduğu durağa, ardından ustaların çalıştığı atölyeye, son olarak kasaba meydanına uğra.">Önce ahşap konakların bulunduğu durağa, ardından ustaların çalıştığı atölyeye, son olarak kasaba meydanına uğra.</p>${listenButton('Önce ahşap konakların bulunduğu durağa, ardından ustaların çalıştığı atölyeye, son olarak kasaba meydanına uğra.', 'route')}<div class="route-slots">${['İlk durak','İkinci durak','Son durak'].map((label,index)=>`<div class="slot" data-slot="${index}" aria-label="${label} yuvası"><small>${label}</small><button type="button" data-slot-button="${index}">${state.stageData.placed?.[index] || 'Buraya taşı'}</button></div>`).join('')}</div><div class="tile-bank">${state.stageData.bank.map((item,index)=>`<button class="move-tile ${state.selected===index?'selected':''}" type="button" draggable="true" data-route-item="${index}" ${state.stageData.placed?.includes(item)?'disabled':''}>${item}</button>`).join('')}</div><p class="feedback" id="feedback" aria-live="polite">Bir kartı sürükle ya da seçip durak yuvasına dokun.</p><button class="primary" type="button" id="checkRoute">Rotayı tamamla →</button>`;
  }
  function renderLoom() {

  }
  function renderMaze() {
    const [row,col] = state.stageData.position; const step = state.stageData.step;
    const cells = [];
    for (let r=0;r<5;r++) for (let c=0;c<5;c++) {
      const key = `${r},${c}`, isCurrent = row===r&&col===c, isGoal = r===0&&c===4, blocked = mazeBlocked.has(key);
      cells.push(`<button type="button" class="${isCurrent?'current ':''}${isGoal?'goal ':''}${blocked?'blocked':''}" data-cell="${r},${c}" aria-label="${isCurrent?'Bulunduğun yer':isGoal?'Meydan':blocked?'Kapalı sokak':'Sokak'}" ${blocked?'disabled':''}>${isCurrent?'●':isGoal?'⌂':blocked?'×':''}</button>`);
    }
    const command = mazeCommands[step];
    return `<div class="eyebrow">Yönleri izle · meydana ulaş</div><h3>Dar sokaklarda yol bul</h3><p data-transcript="Başlangıç noktasından meydana varmak için yönleri sırayla izle. Her seferinde komşu bir sokağa dokun.">Başlangıç noktasından meydana varmak için yönleri sırayla izle. Her seferinde komşu bir sokağa dokun.</p>${listenButton('Başlangıç noktasından meydana varmak için yönleri sırayla izle. Her seferinde komşu bir sokağa dokun.', 'maze')}<div class="direction" id="direction" data-transcript="Sıradaki yön: ${command || 'Meydana ulaştın'}.">Sıradaki yön: <strong>${command || 'Meydana ulaştın'}</strong> · ${step+1} / ${mazeCommands.length}</div><div class="maze" aria-label="Sokak haritası">${cells.join('')}</div><p class="feedback" id="feedback" aria-live="polite">Yön tarifini izleyerek komşu hücreye ilerle.</p><div class="read-row" style="justify-content:center"><button class="secondary" data-move="-1,0" type="button" aria-label="Kuzeye ilerle">↑ Kuzey</button><button class="secondary" data-move="0,-1" type="button" aria-label="Batıya ilerle">← Batı</button><button class="secondary" data-move="1,0" type="button" aria-label="Güneye ilerle">↓ Güney</button><button class="secondary" data-move="0,1" type="button" aria-label="Doğuya ilerle">Doğu →</button></div>`;
  }
  function bindCommon() {
    app.querySelectorAll('[data-speak]').forEach(button => button.addEventListener('click', () => speak(button.dataset.speak, button.dataset.audio)));
    app.querySelectorAll('[data-video]').forEach(button => button.addEventListener('click', () => openVideo(button.dataset.video)));
    app.querySelectorAll('[data-photo]').forEach(button => button.addEventListener('click', () => openPhoto(button.dataset.photo, button.dataset.caption || 'Göynük ve Mudurnu')));
  }
  function bindStage(index) {
    if (index === 0) bindRoute();
    if (index === 1) bindLoom();
    if (index === 2) bindMatch();
    if (index === 3) bindMaze();
  }
  function bindRoute() {
    app.querySelectorAll('[data-route-item]').forEach(tile => {
      tile.addEventListener('click', () => { state.selected = Number(tile.dataset.routeItem); app.querySelectorAll('[data-route-item]').forEach(item=>item.classList.toggle('selected', Number(item.dataset.routeItem)===state.selected)); });
      tile.addEventListener('dragstart', event => { event.dataTransfer.setData('text/plain', tile.dataset.routeItem); });
    });
    app.querySelectorAll('[data-slot]').forEach(slot => {
      slot.addEventListener('dragover', event => event.preventDefault());
      slot.addEventListener('drop', event => { event.preventDefault(); placeRoute(Number(event.dataTransfer.getData('text/plain')), Number(slot.dataset.slot)); });
      slot.addEventListener('click', () => { if (state.selected !== null) placeRoute(state.selected, Number(slot.dataset.slot)); });
    });
    app.querySelectorAll('[data-slot-button]').forEach(button=>button.addEventListener('click',()=>{if(state.selected!==null)placeRoute(state.selected,Number(button.dataset.slotButton));}));
    document.getElementById('checkRoute').addEventListener('click', () => {
      const placed = state.stageData.placed || [];
      if (placed.length !== 3 || placed.some(item=>!item)) { setFeedback('Önce üç durağı da rotaya taşı.', false); return; }
      if (placed.every((item,index)=>item===routeSolution[index])) completeStage('Rotayı sabırla kurdun. Göynük sokaklarının sırası artık sende.');
      else { loseLife('Durakların sırası karışmış. İpuçlarını yeniden dinleyip rotayı düzenle.'); state.stageData.placed=[]; renderStage(); }
    });
  }
  function placeRoute(bankIndex, slotIndex) {
    const item = state.stageData.bank[bankIndex]; if (item === undefined) return;
    const placed = state.stageData.placed || []; placed[slotIndex] = item; state.stageData.placed = placed; state.selected = null;
    renderStage();
  }
  function bindLoom() {
    app.querySelectorAll('[data-word-index]').forEach(button => {
      button.addEventListener('click', () => { state.selected = Number(button.dataset.wordIndex); setFeedback(`“${state.stageData.bank[state.selected]}” seçildi. Şimdi ait olduğu satıra dokun.`, true); app.querySelectorAll('[data-word-index]').forEach(item=>item.classList.toggle('selected', Number(item.dataset.wordIndex)===state.selected)); });
      button.addEventListener('dragstart', event => event.dataTransfer.setData('text/plain', button.dataset.wordIndex));
    });
    app.querySelectorAll('[data-add-word]').forEach(button => {
      const row = Number(button.dataset.addWord);
      button.addEventListener('click',()=>{ if(state.selected===null){setFeedback('Önce bir sözcük seç veya sürükle.',false);return;} addWord(row,state.selected); });
      button.parentElement.addEventListener('dragover',event=>event.preventDefault());
      button.parentElement.addEventListener('drop',event=>{event.preventDefault();addWord(row,Number(event.dataTransfer.getData('text/plain')));});
    });
    app.querySelectorAll('[data-remove-word]').forEach(button=>button.addEventListener('click',()=>{const [row,wordIndex]=button.dataset.removeWord.split(':').map(Number);const word=state.stageData.placed[row].splice(wordIndex,1)[0];const original=state.stageData.bank.indexOf(word);state.stageData.used=state.stageData.used.filter(index=>index!==original);renderStage();}));
    document.getElementById('checkLoom').addEventListener('click',()=>{
      const placed=state.stageData.placed||[[],[]];
      if(placed.some((row,index)=>row.length!==weaveSolutions[index].length)){setFeedback('İki dokuma satırını da tamamla.',false);return;}
      if(placed.every((row,index)=>row.every((word,wordIndex)=>word===weaveSolutions[index][wordIndex]))) completeStage('Sözcükleri bir araya getirip sakin şehirlerin sesini dokudun.');
      else { loseLife('Sözcükler kendi doğal sırasını arıyor. Anlamı dinleyip yeniden dene.'); state.stageData.placed=[[],[]];state.stageData.used=[];renderStage(); }
    });
  }
  function addWord(row,index) {
    if(!Number.isInteger(index)||state.stageData.used?.includes(index))return;
    state.stageData.placed ||= [[],[]]; state.stageData.used ||= [];
    if(state.stageData.placed[row].length>=weaveSolutions[row].length){setFeedback('Bu satır doldu. Diğer satırda devam et.',false);return;}
    state.stageData.placed[row].push(state.stageData.bank[index]);state.stageData.used.push(index);state.selected=null;renderStage();
  }
  function bindMatch() {
    app.querySelectorAll('[data-place]').forEach(button=>button.addEventListener('click',()=>{
      const expected=prompts[state.stageData.prompt].place;
      if(button.dataset.place!==expected){loseLife('Bu yapının ipucu başka bir ilçeyi anlatıyor. Bir kez daha dikkatle dinle.');return;}
      state.score+=1;state.stageData.prompt++ ;playTone('good');
      if(state.stageData.prompt>=prompts.length){completeStage('Dinlediğin ipuçlarını tarihî yapılarla eşleştirdin. Her yapı, yaşadığı şehrin hafızasını taşır.');return;}
      showToast('Güzel eşleştirme! Sıradaki ipucu geliyor.');renderStage();
    }));
  }
  function bindMaze() {
    app.querySelectorAll('[data-move]').forEach(button=>button.addEventListener('click',()=>moveMaze(button.dataset.move.split(',').map(Number))));
    app.querySelectorAll('[data-cell]').forEach(button=>button.addEventListener('click',()=>{
      const [r,c]=button.dataset.cell.split(',').map(Number);const [currentR,currentC]=state.stageData.position;
      const delta=[r-currentR,c-currentC];if(Math.abs(delta[0])+Math.abs(delta[1])===1)moveMaze(delta);
    }));
  }
  function moveMaze(delta) {
    const step=state.stageData.step; if(step>=mazeCommands.length)return;
    const [r,c]=state.stageData.position;const [nextR,nextC]=[r+delta[0],c+delta[1]];const target=mazePath[step+1];
    if(nextR<0||nextR>4||nextC<0||nextC>4||mazeBlocked.has(`${nextR},${nextC}`)){setFeedback('Bu sokak kapalı. Komşu ve açık bir yön seç.',false);playTone('bad');return;}
    if(!target||nextR!==target[0]||nextC!==target[1]){loseLife(`Bu yön “${mazeCommands[step]}” tarifine uymuyor. Haritaya ve sözcüğe yeniden bak.`);return;}
    state.stageData.position=[nextR,nextC];state.stageData.step++;playTone('good');
    if(state.stageData.step>=mazeCommands.length){completeStage('Türkçe yönleri izleyerek meydana ulaştın. Yavaşlamak, çevrendeki ayrıntıları fark ettirir.');return;}
    renderStage();
  }
  function setFeedback(message, good) { const feedback=document.getElementById('feedback');if(feedback){feedback.textContent=message;feedback.style.color=good?'var(--emerald)':'#9c573b';} }
  function updateHud() { const seconds=document.getElementById('seconds');if(seconds)seconds.textContent=state.seconds; }
  function loseLife(message) {
    state.lives--;playTone('bad');showToast(message);
    if(state.lives<=0){failStage('Canların bitti. İpuçlarını yeniden dinleyip bu aşamaya tekrar dönebilirsin.');return;}
    updateHud();setFeedback(message,false);
  }
  function completeStage(message) {
    clearTimer();state.unlocked=Math.max(state.unlocked,state.stage+2);state.score+=2;state.screen='result';playTone('good');
    const final=state.stage===3;
    app.innerHTML=`<section class="result"><div class="seal">✦</div><div class="eyebrow">${final?'Yolculuk tamamlandı':'Aşama tamamlandı'} · +2 yıldız</div><h2>${final?'Sakin şehirlerin izini sürdün':'Güzel bir keşif'}</h2><p data-transcript="${escapeHtml(message)}">${escapeHtml(message)}</p>${listenButton(message,'culture')}<p>${final?'Göynük ve Mudurnu’nun kültürel mirasını dört farklı beceriyle keşfettin.':'Bir sonraki durak haritada seni bekliyor.'}</p>${final?`<a class="primary" href="${HOME_URL}" target="_blank" rel="noopener noreferrer">Haritaya Dön ↗</a>`:`<button class="primary" id="continueMap" type="button">Haritaya dön →</button>`}</section>`;
    bindCommon();const next=document.getElementById('continueMap');if(next)next.addEventListener('click',renderMap);
  }
  function failStage(message) {
    clearTimer();state.screen='failed';
    app.innerHTML=`<section class="result"><div class="seal">↺</div><div class="eyebrow">Bir mola ver</div><h2>Bu durak yeniden denenebilir</h2><p data-transcript="${escapeHtml(message)}">${escapeHtml(message)}</p>${listenButton(message,'culture')}<p><button class="primary" id="retryStage" type="button">Aşamayı yeniden dene ↻</button> <button class="secondary" id="failedMap" type="button">Haritaya dön</button></p></section>`;
    bindCommon();document.getElementById('retryStage').addEventListener('click',()=>startStage(state.stage));document.getElementById('failedMap').addEventListener('click',renderMap);
  }
  function clearTimer() { if(state.timer){clearInterval(state.timer);state.timer=null;} }
  function openVideo(key) {
    const item=videos[key];if(!item)return;
    document.getElementById('modalContent').innerHTML=`<iframe src="${item.url}" title="${escapeHtml(item.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><figcaption>${escapeHtml(item.title)} · Tanıtım amaçlıdır; oyun ilerlemesini etkilemez.</figcaption>`;
    showModal();
  }
  function openPhoto(file, caption) {
    const modalContent=document.getElementById('modalContent');
    modalContent.innerHTML=`<figure><img src="${escapeHtml(file)}" alt="${escapeHtml(caption)}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="hero-scene" hidden aria-label="${escapeHtml(caption)}"><span class="scene-tag">${escapeHtml(caption)}</span><span class="sun"></span><span class="hill back"></span><span class="hill"></span><span class="village"><span class="house" style="--height:68%"><i class="window"></i><i class="window two"></i><i class="door"></i></span><span class="house" style="--height:90%"><i class="window"></i><i class="window two"></i><i class="door"></i></span><span class="house" style="--height:72%"><i class="window"></i><i class="window two"></i><i class="door"></i></span></span><span class="lane"></span></div><figcaption>${escapeHtml(caption)} · Görsel dosyası bulunamazsa çizim yedeği gösterilir.</figcaption></figure>`;
    showModal();
  }
  function showModal() { document.getElementById('modal').classList.add('open');document.getElementById('modalClose').focus(); }
  function closeModal() { const modal=document.getElementById('modal');modal.classList.remove('open');document.getElementById('modalContent').replaceChildren(); }
  document.getElementById('modalClose').addEventListener('click',closeModal);
  document.getElementById('modal').addEventListener('click',event=>{if(event.target.id==='modal')closeModal();});
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape')closeModal();
    if(state.screen==='stage'&&state.stage===3&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)){
      event.preventDefault();const movement={'ArrowUp':[-1,0],'ArrowDown':[1,0],'ArrowLeft':[0,-1],'ArrowRight':[0,1]}[event.key];moveMaze(movement);
    }
  });
  document.getElementById('themeToggle').addEventListener('click',()=>document.body.classList.toggle('dark'));
  function toggleSound(){state.muted=!state.muted;document.getElementById('soundToggle').innerHTML=state.muted?'♫ <span>Kapalı</span>':'♫ <span>Ses</span>';document.getElementById('mobileSound').textContent=state.muted?'♫ Kapalı':'♫ Ses';}
  document.getElementById('soundToggle').addEventListener('click',toggleSound);
  document.getElementById('mobileSound').addEventListener('click',toggleSound);
  document.getElementById('mobileMap').addEventListener('click',renderMap);
  document.getElementById('mobileListen').addEventListener('click',()=>{
    const text=app.querySelector('[data-transcript]')?.dataset.transcript;
    if(text)speak(text,'intro');else showToast('Dinlenecek metin bulunamadı.');
  });
  document.getElementById('brandHome').addEventListener('click',event=>{event.preventDefault();renderCover();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.timer)clearInterval(state.timer);else if(!document.hidden&&state.screen==='stage'&&!state.timer)state.timer=setInterval(()=>{state.seconds--;updateHud();if(state.seconds<=0)failStage('Zaman doldu. Sakin bir nefes alıp bu durağı yeniden deneyebilirsin.');},1000);});
  setupDust();renderCover();
})();
</script>
</body>
</html>
