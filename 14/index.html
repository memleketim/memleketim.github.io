<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolu'nun Kültürel ve Doğal Zenginlikleri</title>
    <style>
        body {
            margin: 0; padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            max-width: 1200px; width: 95%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 { text-align: center; color: white; margin-bottom: 20px; font-size: 2.2em; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); }

        .instructions {
            text-align: center; color: white; margin-bottom: 20px; font-size: 1em;
            background: rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .map-container {
            position: relative; border-radius: 15px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: white; padding: 15px;
            max-width: 800px; margin: 0 auto;
        }

        .map-image { width: 100%; height: auto; display: block; margin: 0 auto; border-radius: 10px; }

        .quiz-point {
            position: absolute; width: 75px; height: 75px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px); border: 2px solid white;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            z-index: 5;
        }

        .quiz-point:hover { transform: scale(1.2); z-index: 10; background: rgba(255, 255, 255, 0.5); }

        .quiz-point-icon {
            width: 90px; height: 90px; object-fit: contain;
            animation: bounce 1.2s infinite alternate;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }

        .tooltip {
            position: absolute; background: rgba(0, 0, 0, 0.85); color: white;
            padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold;
            top: -40px; left: 50%; transform: translateX(-50%);
            opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
        }
        .quiz-point:hover .tooltip { opacity: 1; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 30px; border-radius: 25px; text-align: center; max-width: 550px; width: 90%; box-shadow: 0 15px 50px rgba(0,0,0,0.5); }
        .modal-content h2 { color: #764ba2; margin-bottom: 15px; font-size: 1.8em; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        .modal-content p { color: #444; line-height: 1.7; text-align: justify; font-size: 1.1em; margin-bottom: 25px; }
        
        .btn { padding: 12px 30px; border-radius: 30px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; transition: 0.3s; }
        .btn-primary { background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; }
        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4); }
        .btn-secondary { background: #eee; color: #555; border: none; margin-left: 10px; }

        /* 🗺️ Koordinatlar - Turuncu Bolu İl Sınırları İçerisine Dağılım */
        #p1 { top: 25%; left: 60%; } /* Mengen Aşçılığı (Kuzeydoğu) */
        #p2 { top: 54%; left: 65%; } /* Kartalkaya (Güneydoğu Köroğlu Dağları) */
        #p3 { top: 48%; left: 45%; } /* Abant, Gölcük ve Yedigöller (Merkez ve Göller Havzası) */
        #p4 { top: 65%; left: 18%; } /* Göynük ve Mudurnu (Güneybatı Sakin Şehirler) */
        #p5 { top: 42%; left: 26%; } /* Akşemsettin Hazretleri (Batı) */
    </style>
</head>
<body>

<div class="container">
    <div style="width: 100%; position: relative;">
        <h1>Bolu'nın Kültürel ve Doğal Zenginlikleri</h1>
        <a href="https://memleketim.github.io" class="btn btn-primary" style="position: absolute; top: 0; right: 0;">Ana Sayfa</a>
    </div>

    <div class="instructions">Haritadaki ikonlara tıklayarak Bolu'nun eşsiz lezzetlerini, muazzam doğasını ve manevi mirasını keşfedebilirsiniz. 🌲</div>

    <div class="map-container">
        <img src="map.png" alt="Bolu Haritası" class="map-image">

        <div class="quiz-point" id="p1" 
             data-title="👨‍🍳 Mengen Aşçılığı ve Mutfak Kültürü" 
             data-description="Bolu'nun Mengen ilçesi, Osmanlı saray mutfağından günümüze kadar uzanan eşsiz bir aşçılık geleneğine sahiptir. Türkiye'nin ve dünyanın dört bir yanındaki lüks restoranlarda, beş yıldızlı otellerde mutfağı yöneten en usta şefler genellikle bu şirin ilçemizden yetişir. Her yıl düzenlenen Aşçılık Festivali ile taçlanan bu köklü kültür, nesilden nesile aktarılan gizli tarifleri ve mutfak sanatındaki tartışılmaz hünerleriyle Bolu'yu ülkemizin gastronomi başkentlerinden biri haline getirmektedir."
             data-link="1.html">
            <div class="tooltip">Mengen Aşçılığı</div>
            <img src="1.png" class="quiz-point-icon">
        </div>

        <div class="quiz-point" id="p2" 
             data-title="🏂 Kartalkaya Kış Turizmi Merkezi" 
             data-description="Köroğlu Dağları'nın zirvesinde yer alan Kartalkaya, Türkiye'nin en popüler ve modern kış sporları merkezlerinden biridir. Çam ormanlarıyla çevrili büyüleyici bembeyaz doğası, her seviyeye uygun kilometrelerce uzunluktaki kayak pistleri ve snowboard alanlarıyla kış aylarında adrenalin tutkunlarının vazgeçilmez adresidir. Kaliteli kar yapısı ve modern tesisleriyle misafirlerine dünya standartlarında bir kış tatili deneyimi sunarken, doğanın o dondurucu ama bir o kadar da huzur verici sessizliğini hissettirir."
             data-link="2.html">
            <div class="tooltip">Kartalkaya</div>
            <img src="2.png" class="quiz-point-icon">
        </div>

        <div class="quiz-point" id="p3" 
             data-title="🌲 Abant, Gölcük ve Yedigöller" 
             data-description="Bolu, yeryüzündeki cenneti andıran gölleri ve tabiat parklarıyla doğa harikası bir şehirdir. Sonbaharda sarı ve kızılın her tonuna bürünen Yedigöller Milli Parkı, nilüfer çiçekleriyle süslü Abant Gölü ve etrafındaki çam ağaçlarının suya yansıdığı kartpostallık Gölcük Tabiat Parkı bu güzelliklerin sadece en bilinenleridir. Şelaleleri, tertemiz havası ve zengin bitki örtüsüyle bu bölgeler, doğa yürüyüşleri yapmak ve şehrin gürültüsünden uzaklaşarak nefes almak isteyenler için eşsiz birer sığınaktır."
             data-link="3.html">
            <div class="tooltip">Doğa ve Milli Parklar</div>
            <img src="3.png" class="quiz-point-icon">
        </div>

        <div class="quiz-point" id="p4" 
             data-title="🏡 Göynük ve Mudurnu Sakin Şehirleri" 
             data-description="Tarihi dokusunu ve geleneksel yaşam tarzını günümüze kadar bozulmadan korumayı başaran Göynük ve Mudurnu, uluslararası 'Cittaslow' (Sakin Şehir) ağına üye olan gurur kaynaklarımızdır. Ahşap oymacılığının zarif detaylarını taşıyan tarihi Osmanlı konakları, dar sokakları ve telaşsız yaşam ritmiyle bu ilçelerimiz, zamana meydan okumaktadır. Burada saatler adeta daha yavaş akar; yöresel el sanatları, samimi insan ilişkileri ve geçmişin huzur veren o nostaljik atmosferi ziyaretçilerini zamanda yolculuğa çıkarır."
             data-link="4.html">
            <div class="tooltip">Sakin Şehirler</div>
            <img src="4.png" class="quiz-point-icon">
        </div>

        <div class="quiz-point" id="p5" 
             data-title="🕌 Akşemsettin ve Manevi Miras" 
             data-description="Fatih Sultan Mehmet’in hocası ve İstanbul’un manevi fatihi olarak bilinen büyük Türk-İslam alimi Akşemsettin, Bolu'nun tarihi Göynük ilçesinde ebedi istirahatgahında yatmaktadır. Tıp, astronomi ve biyoloji gibi birçok bilim dalında döneminin çok ilerisinde eserler veren bu değerli şahsiyetin türbesi, ilçenin manevi kalbini oluşturur. Tarihimize yön veren bu büyük bilgenin Göynük'te bulunan kabri, her yıl hem onun ilmi mirasını anlamak hem de o tarihi atmosferi solumak isteyen binlerce kişi tarafından ziyaret edilmektedir."
             data-link="5.html">
            <div class="tooltip">Akşemsettin Türbesi</div>
            <img src="5.png" class="quiz-point-icon">
        </div>
    </div>
</div>

<div id="infoModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle"></h2>
        <p id="modalText"></p>
        <div class="modal-buttons">
            <a href="#" id="activityLinkBtn" class="btn btn-primary">Etkinliğe Git</a>
            <button class="btn btn-secondary" id="closeModalBtn">Kapat</button>
        </div>
    </div>
</div>

<script>
    const quizPoints = document.querySelectorAll('.quiz-point');
    const modal = document.getElementById('infoModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const activityLinkBtn = document.getElementById('activityLinkBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    quizPoints.forEach(point => {
        point.addEventListener('click', function() {
            modalTitle.textContent = this.getAttribute('data-title');
            modalText.textContent = this.getAttribute('data-description');
            activityLinkBtn.href = this.getAttribute('data-link');
            modal.style.display = 'flex';
        });
    });

    closeModalBtn.addEventListener('click', () => modal.style.display = 'none');
    window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
</script>

</body>
</html>
