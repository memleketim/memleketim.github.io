<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konya'nın Kültürel Zenginlikleri</title>
    <style>
        /* DENİZLİ İLE AYNI RENK TEMASI */
        body {
            margin: 0; padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            max-width: 1200px; width: 90%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 { text-align: center; color: white; margin-bottom: 20px; font-size: 2.2em; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); }

        .instructions {
            text-align: center; color: white; margin-bottom: 20px; font-size: 1em;
            background: rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .map-container {
            position: relative; border-radius: 15px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: white; padding: 15px;
            max-width: 700px; margin: 0 auto;
        }

        .map-image { width: 100%; height: auto; display: block; margin: 0 auto; border-radius: 10px; }

        /* İKONLARIN ZIPLAMA VE PARLAMA EFEKTLERİ */
        .quiz-point {
            position: absolute; width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.1));
            backdrop-filter: blur(8px); border: 3px solid rgba(255, 255, 255, 0.4);
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: pulse 2s infinite;
        }

        .quiz-point:hover { transform: scale(1.2); z-index: 10; background: rgba(255, 255, 255, 0.4); }

        .quiz-point-icon {
            width: 105px; height: 105px; object-fit: contain;
            animation: bounce 1s infinite alternate; /* Zıplama efekti */
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        @keyframes pulse {
            0% { box-shadow: 0 4px 15px rgba(0,0,0,0.2), 0 0 0 0 rgba(255,255,255,0.4); }
            100% { box-shadow: 0 4px 15px rgba(0,0,0,0.2), 0 0 0 20px rgba(255,255,255,0); }
        }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }

        /* TOOLTIP (Üzerine gelince çıkan isim) */
        .tooltip {
            position: absolute; background: rgba(0, 0, 0, 0.8); color: white;
            padding: 6px 10px; border-radius: 6px; font-size: 12px;
            top: -35px; left: 50%; transform: translateX(-50%);
            opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
        }
        .quiz-point:hover .tooltip { opacity: 1; }

        /* MODAL */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 20px; border-radius: 15px; text-align: center; max-width: 500px; width: 90%; }
        .btn { padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
        .btn-primary { background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; }
        .btn-secondary { background: #f8f9fa; color: #666; border: 1px solid #ddd; margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="margin: 0;">Konya'nın Kültürel Zenginlikleri</h1>
        <a href="https://memleketim.github.io" class="btn btn-primary">Ana Sayfa</a>
    </div>

    <div class="instructions">Haritadaki ikonlara tıklayarak Konya'nın kültürel zenginlikleri hakkında bilgi alabilirsiniz.</div>

    <div class="map-container">
        <img src="map.png" alt="Konya Haritası" class="map-image">

        <div class="quiz-point" style="top: 48%; left: 45%;" 
             data-title="🕌 Mevlana Müzesi" 
             data-description="Hz. Mevlana'nın dergâhı olan bu yapı, Konya'nın en önemli simgesidir. Yeşil Kubbesi ile dünyanın her yerinden ziyaretçi ağırlar."
             data-link="3.html">
            <div class="tooltip">Mevlana Müzesi</div>
            <img src="0.png" class="quiz-point-icon">
        </div>

        <div class="quiz-point" style="top: 35%; left: 32%;" 
             data-title="🥘 Konya Etli Ekmek" 
             data-description="Konya mutfağının vazgeçilmezi! İncecik açılan hamur üzerine yayılan özel kıymalı harcıyla taş fırınlarda pişen dünyaca ünlü lezzetimizdir."
             data-link="4.html">
            <div class="tooltip">Etli Ekmek</div>
            <img src="1.png" class="quiz-point-icon">
        </div>

        <div class="quiz-point" style="top: 68%; left: 54%;" 
             data-title="🏛 Çatalhöyük" 
             data-description="İnsanlığın ilk yerleşim yerlerinden biri! UNESCO Dünya Mirası Listesi'nde yer alan bu antik kent, 9 bin yıllık geçmişiyle büyüleyicidir."
             data-link="5.html">
            <div class="tooltip">Çatalhöyük</div>
            <img src="2.png" class="quiz-point-icon">
        </div>

        <div class="quiz-point" style="top: 42%; left: 40%;" 
             data-title="📚 İnce Minareli Medrese" 
             data-description="Selçuklu taş işçiliğinin şaheseridir. Günümüzde Taş ve Ahşap Eserler Müzesi olarak hizmet vermektedir."
             data-link="6.html">
            <div class="tooltip">İnce Minareli Medrese</div>
            <img src="3.png" class="quiz-point-icon">
        </div>

        <div class="quiz-point" style="top: 52%; left: 38%;" 
             data-title="🌳 Alaaddin Tepesi Parkı" 
             data-description="Şehrin göbeğinde, Selçuklu Sultanlarının sarayının bulunduğu tarihi bir mesire ve park alanıdır."
             data-link="7.html">
            <div class="tooltip">Alaaddin Tepesi</div>
            <img src="4.png" class="quiz-point-icon">
        </div>

        <div class="quiz-point" style="top: 25%; left: 50%;" 
             data-title="🦋 Tropikal Kelebekler Bahçesi" 
             data-description="Avrupa'nın en büyük kelebek uçuş alanına sahip, binlerce renkli kelebeğin yuvasıdır."
             data-link="8.html">
            <div class="tooltip">Kelebekler Bahçesi</div>
            <img src="5.png" class="quiz-point-icon">
        </div>
    </div>
</div>

<div id="infoModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle"></h2>
        <p id="modalText"></p>
        <div class="modal-buttons">
            <a href="#" id="activityLinkBtn" class="btn btn-primary" target="_blank">Etkinliği Aç</a>
            <button class="btn btn-secondary" id="closeModalBtn">Geri</button>
        </div>
    </div>
</div>

<script>
    const quizPoints = document.querySelectorAll('.quiz-point');
    const modal = document.getElementById('infoModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const activityLinkBtn = document.getElementById('activityLinkBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    quizPoints.forEach(point => {
        point.addEventListener('click', function() {
            modalTitle.textContent = this.getAttribute('data-title');
            modalText.textContent = this.getAttribute('data-description');
            activityLinkBtn.href = this.getAttribute('data-link');
            modal.style.display = 'flex';
        });
    });

    closeModalBtn.addEventListener('click', () => modal.style.display = 'none');
    window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
</script>

</body>
</html>
