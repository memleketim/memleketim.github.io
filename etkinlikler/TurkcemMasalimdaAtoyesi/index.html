<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkçem Masalımda Atölyesi</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e1b4b;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #a78bfa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 4rem 2rem 2rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #c084fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(139, 92, 246, 0.2);
            animation: fadeInDown 1s ease-out;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-top: 1rem;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            padding: 2rem;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-primary);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease-out both;
        }

        .card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .card:nth-child(5) {
            animation-delay: 0.5s;
        }

        .card:nth-child(6) {
            animation-delay: 0.6s;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 0 0 20px rgba(139, 92, 246, 0.3);
            border-color: rgba(139, 92, 246, 0.5);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 75%;
            /* 4:3 Aspect Ratio */
            overflow: hidden;
        }

        .card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .card:hover img {
            transform: scale(1.1);
        }

        .card-img-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0.2) 50%, rgba(15, 23, 42, 0) 100%);
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .card:hover .card-img-overlay {
            opacity: 1;
        }

        .card-content {
            padding: 1.5rem;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            transform: translateY(20px);
            transition: transform 0.4s ease;
        }

        .card:hover .card-content {
            transform: translateY(0);
        }

        .card h2 {
            font-size: 1.5rem;
            margin: 0;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .card .btn-play {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
            padding: 0.5rem 1.2rem;
            background: var(--accent);
            color: white;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .card:hover .btn-play {
            opacity: 1;
            transform: translateY(0);
            background: var(--accent-hover);
        }

        .btn-play svg {
            width: 16px;
            height: 16px;
            margin-right: 6px;
        }

        /* Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="particles" id="particles"></div>

    <header>
        <h1>Türkçem Masalımda</h1>
        <p class="subtitle">Atölye Seçkileri</p>
    </header>

    <div class="container">

                <div class="card-img-overlay"></div>

            <div class="card-content">
                <h2>Kahve</h2>

                    onerror="this.src='https://via.placeholder.com/800x600/1e1b4b/8b5cf6?text=Karga+ile+Bulbul'">
                <div class="card-img-overlay"></div>
            </div>
            <div class="card-content">
                <h2>Karga ile Bülbül</h2>
                <div class="btn-play">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z" />
                    </svg>

                </div>

        <a href="sultansuyu/index.html" class="card">
            <div class="card-img-wrapper">
                <img src="sultansuyu/kapak.jpg" alt="Sultan Suyu"
                    onerror="this.src='https://via.placeholder.com/800x600/1e1b4b/8b5cf6?text=Sultan+Suyu'">
                <div class="card-img-overlay"></div>
            </div>
            <div class="card-content">

                    </svg>
                    Masalı Gör
                </div>
            </div>
        </a>

        <a href="unye/index.html" class="card">
            <div class="card-img-wrapper">
                <img src="unye/kapak.jpg" alt="Ünye"
                    onerror="this.src='https://via.placeholder.com/800x600/1e1b4b/8b5cf6?text=Unye'">
                <div class="card-img-overlay"></div>
            </div>
            <div class="card-content">

        <a href="yogurt/index.html" class="card">
            <div class="card-img-wrapper">
                <img src="yogurt/kapak.jpg" alt="Yoğurt"
                    onerror="this.src='https://via.placeholder.com/800x600/1e1b4b/8b5cf6?text=Yogurt'">
                <div class="card-img-overlay"></div>
            </div>
            <div class="card-content">
                <h2>Yoğurt</h2>
                <div class="btn-play">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                    Masalı Gör
                </div>
            </div>
        </a>
    </div>

    <script>
        // Create random particles in the background
        const particlesContainer = document.getElementById('particles');
        const particleCount = 20;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');

            // Random properties
            const size = Math.random() * 10 + 5;
            const left = Math.random() * 100;
            const duration = Math.random() * 15 + 10;
            const delay = Math.random() * 10;

            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}vw`;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `${delay}s`;

            particlesContainer.appendChild(particle);
        }
    </script>
</body>

</html>
